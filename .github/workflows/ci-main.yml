name: CI (main)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Run checks
        run: deno task check

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Run e2e suite from a path containing spaces and Unicode
        run: |
          e2e_directory="$RUNNER_TEMP/auth review ü"
          mkdir -p "$e2e_directory"
          cp -R "$GITHUB_WORKSPACE/." "$e2e_directory/"
          deno task --cwd "$e2e_directory" e2e

      - name: Install Chromium
        run: deno task browser:install --with-deps

      - name: Run browser login tests
        run: deno task test:browser
